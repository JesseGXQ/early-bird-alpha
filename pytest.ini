[pytest]
testpaths = tests
addopts =
    --basetemp=.pytest_cache/pytest-basetemp
    --ignore=tests/factors/library/others
    --ignore=tests/research/experiments
markers =
    sample_data: uses the small sample dataset shipped with the repository
    real_data: requires external RAW_DATA or gitignored full database files
    integration: integrates multiple project components
    slow: too slow for the default test command
